function km(lat1,lon1,lat2,lon2){const R=6371,r=d=>d*Math.PI/180;const a=Math.sin(r(lat2-lat1)/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lon2-lon1)/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

const SCHOOL_ORDER=SCHOOLS.map((_,i)=>i).sort((a,b)=>SCHOOLS[a][1].localeCompare(SCHOOLS[b][1],'pt'));
function schoolFilter(q){q=(q||'').trim().toLowerCase();if(!q)return SCHOOL_ORDER;return SCHOOL_ORDER.filter(i=>{const s=SCHOOLS[i];return s[1].toLowerCase().includes(q)||s[3].toLowerCase().includes(q)||s[4].toLowerCase().includes(q)})}
function schoolInfoBox(i){const s=SCHOOLS[i];return `<div class="text-sm border p-3 mt-2" style="border-color:var(--hair)"><div class="font-medium">${esc(s[1])}</div><div class="opacity-80">${esc(s[2])}</div><div class="opacity-80">${esc(s[3])} · ${esc(s[4])}</div><div class="opacity-60 text-xs mt-0.5">Subprefeitura ${esc(s[5])} · Diretoria ${esc(s[6])}</div>${s[7]?`<div class="opacity-80">Tel: ${esc(s[7])}</div>`:''}</div>`}
function schoolResultsHtml(target,list){if(!list.length)return '<div class="px-3 py-2 text-xs opacity-50">Nenhuma escola encontrada.</div>';return list.map(i=>`<div onmousedown="pickSchool2('${target}',${i})" class="px-3 py-2 cursor-pointer hover:bg-black/5 border-b" style="border-color:var(--hair)"><div>${esc(SCHOOLS[i][1])}</div><div class="text-xs opacity-60">${esc(SCHOOLS[i][3])} · ${esc(SCHOOLS[i][4])}</div></div>`).join('')}

let SAMPLE=null,SAMPLE_IMG=false;
(async()=>{try{SAMPLE=await claude.use('sample');if(SAMPLE){const lim=await SAMPLE.limits().catch(()=>null);SAMPLE_IMG=!!(lim&&lim.images)}}catch(e){}render()})();
async function simulateOCR(){
 if(!ST.tmp.coverFile)return alert('Envie a foto da capa antes de continuar.');
 ST.tmp.scanning=true;ST.tmp.ocrNote='';render();
 let done=false;
 if(SAMPLE&&SAMPLE_IMG){
  try{
   const prompt='Esta imagem é a foto da capa de um livro ou material didático escolar brasileiro. Leia o que está escrito na capa e responda SOMENTE com um JSON no formato {"titulo":string,"autor":string,"editora":string,"disciplina_ano":string}. Use string vazia "" para o que não conseguir ler. Não invente informação que não esteja visível na foto.';
   const data=await SAMPLE.json(prompt,{images:ST.tmp.coverFile,modelTier:'quick'});
   if(data&&typeof data==='object'){ST.tmp.title=data.titulo||ST.tmp.title;ST.tmp.author=data.autor||ST.tmp.author;ST.tmp.publisher=data.editora||ST.tmp.publisher;ST.tmp.discipline=data.disciplina_ano||ST.tmp.discipline;ST.tmp.ocrNote='Lido automaticamente a partir da foto pela IA — confira e edite os campos se precisar.';done=true}
  }catch(e){
   if(e&&e.code==='not_granted'){ST.tmp.ocrNote='Leitura automática não autorizada nesta sessão — preencha manualmente ou tente de novo.'}
   else{ST.tmp.ocrNote='Não deu para ler a foto agora ('+(e&&e.code||'erro')+'). Preenchendo com um exemplo — edite como quiser.'}
  }
 }
 if(!done&&!(SAMPLE&&SAMPLE_IMG)){ST.tmp.ocrNote='Leitura automática por IA indisponível nesta visualização — preenchido com um exemplo simulado, edite livremente.'}
 if(!done){const p=OCR_POOL[Math.floor(Math.random()*OCR_POOL.length)];ST.tmp.title=ST.tmp.title||p[0];ST.tmp.author=ST.tmp.author||p[1];ST.tmp.publisher=ST.tmp.publisher||p[2];ST.tmp.discipline=ST.tmp.discipline||p[3]}
 ST.tmp.scanning=false;render();
}

 const donorId=ensureUserId(ST.user.email,ST.user.name);
 const book={id:uid(),adId:adId(),title:t.title,author:t.author,publisher:t.publisher,editionYear:t.editionYear||'',discipline:t.discipline,notes:t.notes||'',condition:t.condition,cover:t.cover,extra:t.extra,modality:t.modality,schoolIdx:t.schoolIdx,donor:{name:ST.user.name,email:ST.user.email},donorId,status:'Disponível',pending:null,transaction:null,createdAt:Date.now()};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SEED_TITLES=[
 ['Dom Casmurro','Machado de Assis','Companhia das Letras','Literatura Brasileira'],
 ['O Cortiço','Aluísio Azevedo','Ática','Literatura Brasileira'],
 ['Vidas Secas','Graciliano Ramos','Record','Literatura Brasileira'],
 ['Matemática 6º Ano','Kátia Bianchini','Moderna','Matemática'],
 ['Português: Linguagens 9º Ano','William Cereja','Saraiva','Língua Portuguesa'],
 ['Ciências da Natureza 7º Ano','Carlos Barros','Ática','Ciências'],
 ['História: Sociedade e Cidadania 8º Ano','Alfredo Boulos Jr.','FTD','História'],
 ['Geografia em Rede 6º Ano','Melhem Adas','Scipione','Geografia'],
 ['O Pequeno Príncipe','Antoine de Saint-Exupéry','Agir','Literatura Infantojuvenil'],
 ['Menina Bonita do Laço de Fita','Ana Maria Machado','Ática','Literatura Infantil'],
 ['Sítio do Picapau Amarelo','Monteiro Lobato','Globinho','Literatura Infantojuvenil'],
 ['Iracema','José de Alencar','Ática','Literatura Brasileira'],
 ['A Moreninha','Joaquim Manuel de Macedo','Martin Claret','Romance'],
 ['Poemas e Canções','Cecília Meireles','Global','Poesia'],
 ['Ciências Físicas e Biológicas 9º Ano','Paula Louzano','Moderna','Ciências'],
 ['Inglês em Contexto 7º Ano','Michael Souza','Richmond','Língua Inglesa']
];
function seedSyntheticData(){
 const rnd=mulberry32(20260926);
 const rndInt=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
 const pick=arr=>arr[Math.floor(rnd()*arr.length)];
 const day=n=>Date.now()-Math.max(0,n)*86400000;
 const later=(baseAgo,minGap,maxGap)=>Math.max(0,baseAgo-rndInt(minGap,maxGap));
 const SYN_USERS=Array.from({length:10},(_,i)=>'USR'+String(101+i));
 const pickUser=exclude=>{let u;do{u=pick(SYN_USERS)}while(u===exclude);return u};
 const CONDS=['Novo','Bom','Regular','Desgastado'];
 function mkBook(modality,ago,schoolIdx){
  const t=pick(SEED_TITLES);const donor=pick(SYN_USERS);
  return {id:uid(),adId:adId(),title:t[0],author:t[1],publisher:t[2],editionYear:String(rndInt(2008,2024)),discipline:t[3],notes:rnd()<0.35?pick(['Capa com marcas de uso','Contém anotações a lápis','Falta a contracapa','Edição antiga, mas completa','Usado em atividade de sala de aula','']):'',condition:pick(CONDS),cover:null,extra:[],modality,schoolIdx,donor:{name:'Usuário '+donor,email:''},donorId:donor,status:'Disponível',pending:null,transaction:null,createdAt:day(ago)};
 }
 function mkOffered(modality){if(modality!=='troca')return{title:null,author:null,publisher:''};const t=pick(SEED_TITLES);return{title:t[0],author:t[1],publisher:t[2]}}
 const books=[];
 for(let i=0;i<10;i++){
  const ago=rndInt(20,210);const b=mkBook(pick(['troca','doacao']),ago,rndInt(0,SCHOOLS.length-1));books.push(b);
  if(i>=6){const reqAgo=later(ago,1,10);const of=mkOffered(b.modality);const req={id:uid(),bookId:b.id,requesterName:'Usuário '+pickUser(b.donorId),requesterEmail:'',requesterId:pickUser(b.donorId),modality:b.modality,offeredTitle:of.title,offeredAuthor:of.author,offeredPublisher:of.publisher,offeredNotes:'',offeredPhoto:null,status:'recusada',reason:pick(DECLINE_REASONS),createdAt:day(reqAgo),respondedAt:day(later(reqAgo,1,3))};ST.requests.push(req)}
 }
 for(let i=0;i<5;i++){
  const ago=rndInt(5,60);const b=mkBook(pick(['troca','doacao']),ago,rndInt(0,SCHOOLS.length-1));
  const reqAgo=later(ago,1,4);const requester=pickUser(b.donorId);const of=mkOffered(b.modality);
  const req={id:uid(),bookId:b.id,requesterName:'Usuário '+requester,requesterEmail:'',requesterId:requester,modality:b.modality,offeredTitle:of.title,offeredAuthor:of.author,offeredPublisher:of.publisher,offeredNotes:'',offeredPhoto:null,status:'pendente',reason:'',createdAt:day(reqAgo),respondedAt:null};
  b.pending=req;ST.requests.push(req);books.push(b);
 }
 for(let i=0;i<4;i++){
  const ago=rndInt(30,150);const b=mkBook(pick(['troca','doacao']),ago,rndInt(0,SCHOOLS.length-1));
  const reqAgo=later(ago,2,10);const acceptAgo=later(reqAgo,1,5);const requester=pickUser(b.donorId);const of=mkOffered(b.modality);
  const req={id:uid(),bookId:b.id,requesterName:'Usuário '+requester,requesterEmail:'',requesterId:requester,modality:b.modality,offeredTitle:of.title,offeredAuthor:of.author,offeredPublisher:of.publisher,offeredNotes:'',offeredPhoto:null,status:'aceita',reason:'',createdAt:day(reqAgo),respondedAt:day(acceptAgo)};
  ST.requests.push(req);
  const tr={code:trcId(),bookId:b.id,requestId:req.id,requesterName:req.requesterName,requesterEmail:'',requesterId:requester,donorId:b.donorId,modality:b.modality,offeredTitle:req.offeredTitle,offeredAuthor:req.offeredAuthor,offeredPublisher:req.offeredPublisher,offeredNotes:'',status:'reservado',requestCreatedAt:req.createdAt,acceptedAt:day(acceptAgo),completedAt:null};
  ST.transactions.push(tr);b.status='Reservado';b.transaction=tr;books.push(b);
 }
 for(let i=0;i<8;i++){
  const modality=i<5?'troca':'doacao';const finalStatus=modality==='troca'?'Trocado':'Doado';
  const ago=rndInt(40,200);const b=mkBook(modality,ago,rndInt(0,SCHOOLS.length-1));
  const reqAgo=later(ago,2,12);const acceptAgo=later(reqAgo,1,6);const completeAgo=later(acceptAgo,1,10);const requester=pickUser(b.donorId);const of=mkOffered(modality);
  const req={id:uid(),bookId:b.id,requesterName:'Usuário '+requester,requesterEmail:'',requesterId:requester,modality,offeredTitle:of.title,offeredAuthor:of.author,offeredPublisher:of.publisher,offeredNotes:'',offeredPhoto:null,status:'aceita',reason:'',createdAt:day(reqAgo),respondedAt:day(acceptAgo)};
  ST.requests.push(req);
  const tr={code:trcId(),bookId:b.id,requestId:req.id,requesterName:req.requesterName,requesterEmail:'',requesterId:requester,donorId:b.donorId,modality,offeredTitle:req.offeredTitle,offeredAuthor:req.offeredAuthor,offeredPublisher:req.offeredPublisher,offeredNotes:'',status:'concluido',requestCreatedAt:req.createdAt,acceptedAt:day(acceptAgo),completedAt:day(completeAgo)};
  ST.transactions.push(tr);b.status=finalStatus;b.transaction=tr;books.push(b);
 }
 {const ago=rndInt(60,180);const b=mkBook(pick(['troca','doacao']),ago,rndInt(0,SCHOOLS.length-1));b.status='Cancelado';books.push(b)}
 ST.books=ST.books.concat(books);save();
}

function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(rows){if(!rows.length)return '';const headers=Object.keys(rows[0]);const lines=[headers.join(',')];rows.forEach(r=>lines.push(headers.map(h=>csvEsc(r[h])).join(',')));return lines.join('\n')}

async function downloadCsv(filename,rows){if(!rows.length)return alert('Ainda não há dados desse tipo nesta sessão.');try{const csv=toCsv(rows);const dl=await claude.use('downloads');if(!dl)return alert('Download indisponível nesta visualização.');await dl.save({filename,data:csv})}catch(e){console.error('downloadCsv',e);alert('Não foi possível gerar esse arquivo agora. Tente novamente.')}}
async function downloadFullXlsx(){
 try{
  if(window.__xlsxReady===false||typeof XLSX==='undefined'||!XLSX.utils||typeof XLSX.write!=='function'){
   return alert('A biblioteca de exportação em Excel não carregou nesta visualização. Verifique sua conexão e tente novamente.');
  }
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tableTransacoes()),'Transacoes');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tableSolicitacoes()),'Solicitacoes');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tableLivros()),'Livros');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tableEscolas()),'Escolas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tableDicionario()),'Dicionario_Dados');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([out],{type:'application/octet-stream'});
  const dl=await claude.use('downloads');
  if(!dl)return alert('Download indisponível nesta visualização.');
  await dl.save({filename:'Troca_Livro_SP_Dados_Analiticos.xlsx',data:blob});
 }catch(e){
  console.error('downloadFullXlsx',e);
  alert('Não foi possível gerar a planilha agora. Tente novamente em instantes.');
 }
}

<div class="flex gap-4 mt-6"><button onclick="printReceipt()" class="bg-moss text-white px-5 py-2 text-sm">Imprimir / Salvar PDF</button><button onclick="go('mine')" class="text-sm underline opacity-70">Fechar</button></div>
</div>`}

function declinePicker(id){return `<div class="mt-2 text-xs">${DECLINE_REASONS.map((r,i)=>`<button onclick="declineRequest('${id}',${i})" class="block underline opacity-70 mb-1 text-left">${esc(r)}</button>`).join('')}<button onclick="declineRequest('${id}',-1)" class="block underline opacity-50 text-left">Recusar sem informar motivo</button></div>`}

function mineRow(b){const s=SCHOOLS[b.schoolIdx];const mod=MODALITIES[b.modality];let actionHtml='';
if(b.status==='Disponível'&&b.pending){const p=b.pending;actionHtml=`<div class="border p-3 mt-2 text-sm" style="border-color:var(--hair)"><p class="mb-1">📩 Solicitação de <b>${esc(p.requesterName)}</b>${b.modality==='troca'?` — oferece em troca: <b>${esc(p.offeredTitle||'—')}</b>${p.offeredAuthor?' ('+esc(p.offeredAuthor)+')':''}${p.offeredPublisher?', '+esc(p.offeredPublisher):''}`:''}</p>${p.offeredNotes?`<p class="text-xs opacity-60 mb-1">Obs.: ${esc(p.offeredNotes)}</p>`:''}<div class="flex gap-3 mt-2"><button onclick="acceptRequest('${b.id}')" class="bg-moss text-white text-xs px-3 py-1">${b.modality==='troca'?'Aceitar troca':'Aceitar'}</button><button onclick="ST.declineFor=ST.declineFor==='${b.id}'?null:'${b.id}';render()" class="border text-xs px-3 py-1" style="border-color:var(--hair)">Recusar</button></div>${ST.declineFor===b.id?declinePicker(b.id):''}</div>`}
else if(b.status==='Disponível'&&!b.pending){actionHtml=ST.confirmingCancel===b.id?`<div class="text-xs mt-1">Retirar este anúncio? Ele deixa de ficar disponível. <button onclick="cancelAd('${b.id}')" class="underline spred ml-1">Confirmar</button> <button onclick="cancelCancelAd()" class="underline opacity-60 ml-1">Cancelar</button></div>`:`<button onclick="askCancelAd('${b.id}')" class="text-xs underline opacity-60 mt-1">Retirar anúncio</button>`}
else if(b.status==='Reservado'){actionHtml=`<div class="text-sm mt-1"><button onclick="ST.voucherBook='${b.id}';go('voucher')" class="underline text-xs mr-3">Ver voucher</button><button onclick="confirmPickup('${b.id}')" class="bg-moss text-white text-xs px-3 py-1">Confirmar retirada</button></div>`}
else if(b.status==='Trocado'||b.status==='Doado'){actionHtml=`<button onclick="ST.voucherBook='${b.id}';go('voucher')" class="underline text-xs mt-1">Ver voucher</button>`}
return `<div class="py-3 border-t text-sm" style="border-color:var(--hair)"><div class="serif">${esc(b.title)} <span class="text-xs border px-1.5 py-0.5 ml-1" style="border-color:var(--hair)">${mod.icon} ${mod.label}</span></div><div class="opacity-70">${esc(s[1])} · <span class="opacity-90">${b.status}</span></div>${actionHtml}</div>`}

function reqRow(b){const s=SCHOOLS[b.schoolIdx];let extra;if(b.status==='Reservado')extra=`<button onclick="ST.voucherBook='${b.id}';go('voucher')" class="underline text-xs mr-3">Ver voucher</button><button onclick="confirmPickup('${b.id}')" class="bg-moss text-white text-xs px-3 py-1">Confirmar retirada</button>`;else if(b.status==='Trocado'||b.status==='Doado')extra=`<button onclick="ST.voucherBook='${b.id}';go('voucher')" class="underline text-xs">Ver voucher</button>`;else extra=`<span class="opacity-50">Aguardando resposta do proprietário</span>`;return `<div class="py-3 border-t text-sm" style="border-color:var(--hair)"><div class="serif">${esc(b.title)}</div><div class="opacity-70">${esc(s[1])} · ${b.status}</div><div class="mt-1">${extra}</div></div>`}

function scrMine(){const mine=ST.books.filter(b=>b.donor.name===ST.user.name);const requested=ST.books.filter(b=>(b.pending&&b.pending.requesterName===ST.user.name)||(b.transaction&&b.transaction.requesterName===ST.user.name));return `<div class="pt-10">
<button onclick="go('home')" class="text-sm opacity-60 mb-6">&larr; voltar</button>
<h2 class="serif text-2xl mb-6">Meus livros</h2>
<h3 class="text-sm font-medium mb-2 opacity-70">Ofertados por você</h3>
<div class="mb-8">${mine.length?mine.map(mineRow).join(''):'<p class="text-sm opacity-60">Você ainda não cadastrou livros.</p>'}</div>
<h3 class="text-sm font-medium mb-2 opacity-70">Solicitados por você</h3>
<div>${requested.length?requested.map(reqRow).join(''):'<p class="text-sm opacity-60">Nenhuma solicitação ainda.</p>'}</div>
</div>`}

function scrManager(){return `<div class="pt-10">
<button onclick="go('home')" class="text-sm opacity-60 mb-6">&larr; voltar</button>
<h2 class="serif text-2xl mb-2">Área de dados / gestor</h2>
<p class="text-sm opacity-70 mb-1">${ST.books.length} livro(s) · ${ST.requests.length} solicitação(ões) · ${ST.transactions.length} transação(ões) · ${SCHOOLS.length} escolas na base.</p>
<p class="text-xs opacity-50 mb-8">Os números acima incluem dados sintéticos gerados para demonstração e não representam estatísticas reais da Prefeitura de São Paulo.</p>
<h3 class="serif text-lg mb-1">Dados para análise</h3>
<p class="text-sm opacity-70 mb-1">Exporte os dados da plataforma para análises e relatórios.</p>
<p class="text-xs opacity-50 mb-4">Os dados disponíveis neste protótipo são sintéticos e destinados exclusivamente à demonstração da solução. A exportação usa apenas identificadores técnicos de usuário (ex.: USR001) — nenhum nome, e-mail ou outro dado pessoal é incluído.</p>
<div class="flex flex-col gap-3 max-w-xs mb-6">
<button onclick="downloadCsv('transacoes.csv',tableTransacoes())" class="border px-4 py-2 text-sm text-left" style="border-color:var(--hair)">Baixar transações (.csv)</button>
<button onclick="downloadCsv('solicitacoes.csv',tableSolicitacoes())" class="border px-4 py-2 text-sm text-left" style="border-color:var(--hair)">Baixar solicitações (.csv)</button>
<button onclick="downloadCsv('livros.csv',tableLivros())" class="border px-4 py-2 text-sm text-left" style="border-color:var(--hair)">Baixar livros (.csv)</button>
<button onclick="downloadCsv('escolas.csv',tableEscolas())" class="border px-4 py-2 text-sm text-left" style="border-color:var(--hair)">Baixar escolas (.csv)</button>
<button onclick="downloadFullXlsx()" class="bg-moss text-white px-4 py-2 text-sm text-left">Baixar base completa (.xlsx)</button>
</div>
<p class="text-xs opacity-50 mb-8">A base completa reúne Transações, Solicitações, Livros, Escolas e um Dicionário de Dados, em abas separadas com identificadores em comum entre elas (pronta para Excel, Python, Tableau ou Power BI).</p>
${ST.confirmingReset?`<div class="text-xs max-w-xs"><p class="mb-2">Isso substitui os livros, solicitações e transações atuais pelos dados sintéticos de demonstração.</p><button onclick="doResetSynthetic()" class="underline spred mr-3">Confirmar</button><button onclick="cancelResetSynthetic()" class="underline opacity-60">Cancelar</button></div>`:`<button onclick="resetSyntheticData()" class="text-xs underline opacity-50">Recarregar dados sintéticos de demonstração</button>`}
</div>`}

function render(){let html;
if(ST.screen==='privacy')html=scrPrivacy();
else if(!ST.user)html=scrLogin();
else if(ST.screen==='switchUser')html=scrSwitchUser();
else if(ST.screen==='offer')html=scrOffer();
else if(ST.screen==='offerDone')html=scrOfferDone();
else if(ST.screen==='search')html=scrSearch();
else if(ST.screen==='trade')html=scrTradeForm();
else if(ST.screen==='requestSent')html=scrRequestSent();
else if(ST.screen==='voucher')html=scrVoucher();
else if(ST.screen==='mine')html=scrMine();
else if(ST.screen==='manager')html=scrManager();
else html=scrHome();
document.getElementById('app').innerHTML=(ST.user&&ST.screen!=='login'?userBarHtml():'')+html}

load();if(!ST.books.length)seedSyntheticData();ST.screen=ST.user?'home':'login';render();
</script>
</body>
</html>
